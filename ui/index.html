<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SimpleCam</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="logo.png" alt="" class="logo" />
    <h1>SimpleCam</h1>
    <span class="kbd" title="Global hotkey">F9</span>
  </header>

  <main>
    <div class="seg" id="seg">
      <button data-source="screen">Screen</button>
      <button data-source="window">Window</button>
    </div>

    <div id="row-monitor"><select id="monitor" data-key="monitor" data-type="int"></select></div>
    <div id="row-window" class="inline">
      <select id="window" data-key="window"></select>
      <button id="refresh" class="ghost" title="Refresh window list">&#8635;</button>
    </div>

    <div class="two">
      <select id="res" data-key="res" data-type="int"></select>
      <select id="fps" data-key="fps" data-type="int"></select>
    </div>

    <div class="rec-wrap">
      <button id="rec" class="rec" aria-label="Start or stop recording"><span></span></button>
      <div id="timer" class="timer">Ready</div>
      <div id="preview" class="preview"></div>
    </div>

    <details>
      <summary>More settings</summary>
      <div class="more">
        <div class="row"><label for="codec">Codec</label>
          <select id="codec" data-key="codec">
            <option value="h264">H.264 (compatible)</option>
            <option value="hevc">HEVC (smaller files)</option>
          </select></div>
        <div class="row"><label for="quality">Quality</label>
          <div class="inline">
            <select id="quality" data-key="quality">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
            <label class="check"><input type="checkbox" id="custom" data-key="custom" data-type="bool" /> Custom</label>
          </div></div>
        <div class="row" id="row-mbps"><label for="mbps">Bitrate</label>
          <div class="inline"><input type="range" id="mbps" min="0.5" max="100" step="0.5" data-key="mbps" data-type="float" /><b id="mbps-val"></b></div></div>
        <div class="row"><label for="countdown">Countdown</label>
          <select id="countdown" data-key="countdown" data-type="int">
            <option value="0">Off</option>
            <option value="1">3 seconds</option>
            <option value="2">5 seconds</option>
            <option value="3">10 seconds</option>
          </select></div>
        <div class="row"><label for="folder">Save to</label>
          <div class="inline"><input type="text" id="folder" data-key="folder" spellcheck="false" />
            <button id="browse" class="ghost">Browse</button></div></div>
        <div class="checks">
          <label class="check"><input type="checkbox" data-key="cursor" data-type="bool" /> Show cursor</label>
          <label class="check"><input type="checkbox" data-key="border" data-type="bool" /> Capture border</label>
          <label class="check"><input type="checkbox" data-key="minimize" data-type="bool" /> Minimize while recording</label>
          <label class="check"><input type="checkbox" data-key="onTop" data-type="bool" data-free="1" /> Keep on top</label>
          <label class="check wide" title="Turn off only if you have a fast GPU and the video looks correct"><input type="checkbox" data-key="compat" data-type="bool" /> Smooth mode (recommended, fixes green video)</label>
        </div>
      </div>
    </details>

    <footer>
      <button id="open-folder" class="link">Open folder</button>
      <button id="play-last" class="link" hidden>Show last recording</button>
    </footer>
    <p id="status" class="status">Press F9 to start or stop.</p>
  </main>

  <div id="overlay" hidden><span id="overlay-num">3</span></div>
  <script src="main.js"></script>
</body>
</html>
