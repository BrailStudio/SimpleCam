<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; cursor: crosshair; user-select: none; font: 14px "Segoe UI", sans-serif; }
  #dim { position: fixed; inset: 0; background: rgba(8, 6, 14, .45); }
  #box { position: fixed; border: 2px solid #8b5cf6; background: rgba(139, 92, 246, .12); box-shadow: 0 0 0 9999px rgba(8, 6, 14, .45); display: none; }
  #tip { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #15121ee6; color: #fff; padding: 8px 16px; border-radius: 8px; border: 1px solid #2a2540; }
  #size { position: fixed; background: #8b5cf6; color: #fff; padding: 2px 8px; border-radius: 4px; display: none; font-size: 12px; }
</style>
</head>
<body>
  <div id="dim"></div>
  <div id="box"></div>
  <div id="size"></div>
  <div id="tip">Drag to select the recording area &middot; Esc to cancel</div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const box = document.getElementById("box"), size = document.getElementById("size"), dim = document.getElementById("dim");
    let sx = 0, sy = 0, drag = false;
    const rect = (e) => ({ x: Math.min(sx, e.clientX), y: Math.min(sy, e.clientY), w: Math.abs(e.clientX - sx), h: Math.abs(e.clientY - sy) });
    const done = (r, cancelled) => {
      const d = window.devicePixelRatio || 1;
      invoke("region_done", { x: Math.round(r.x * d), y: Math.round(r.y * d), w: Math.round(r.w * d), h: Math.round(r.h * d), cancelled });
    };
    addEventListener("mousedown", (e) => { drag = true; sx = e.clientX; sy = e.clientY; dim.style.display = "none"; box.style.display = "block"; size.style.display = "block"; });
    addEventListener("mousemove", (e) => {
      if (!drag) return;
      const r = rect(e), d = window.devicePixelRatio || 1;
      Object.assign(box.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
      size.textContent = `${Math.round(r.w * d)} \u00d7 ${Math.round(r.h * d)}`;
      size.style.left = r.x + "px"; size.style.top = Math.max(0, r.y - 24) + "px";
    });
    addEventListener("mouseup", (e) => {
      if (!drag) return;
      drag = false;
      const r = rect(e);
      done(r, r.w < 8 || r.h < 8);
    });
    addEventListener("keydown", (e) => { if (e.key === "Escape") done({ x: 0, y: 0, w: 0, h: 0 }, true); });
  </script>
</body>
</html>
