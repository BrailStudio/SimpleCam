name: Build SimpleCam (portable exe)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build SimpleCam
        run: npm run build

      - name: Collect portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/simplecam.exe dist/SimpleCam.exe
          Get-Item dist/SimpleCam.exe | Select-Object Name, Length

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: SimpleCam-portable
          if-no-files-found: error
          path: dist/SimpleCam.exe

      - name: Publish GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/SimpleCam.exe
