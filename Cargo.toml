[package]
name = "brailcam"
version = "0.1.0"
edition = "2021"
description = "BrailCam - a lightweight screen recorder for Windows"

[dependencies]
windows-capture = "1.5.0"
global-hotkey = "0.6"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
chrono = "0.4"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
